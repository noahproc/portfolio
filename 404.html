<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Noah Proctor</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<script>
  /* GitHub Pages serves this page for any address that doesn't exist.
     Old addresses (from before the site moved to clean URLs) forward to their new home
     before anything is drawn; anything else gets the "not found" page below. */
  (function () {
    var PAGES = {
      'index': '/', 'work': '/product/', 'projects': '/data-science/', 'about': '/about/',
      'transplant-case-study': '/product/transplant/', 'series-case-study': '/product/series/',
      'threshold-case-study': '/product/threshold/', 'aden-prd': '/product/hive-onboarding/',
      'phia-teardown': '/product/phia-teardown/', 'airline-booking-case': '/product/airline-booking/',
      'coaster': '/', 'resume': '/resume/', 'data-science': '/data-science/', 'product': '/product/'
    };
    var PREFIXES = [   /* old asset folders -> new ones */
      ['/pictures/stickers/', '/assets/images/stickers/'], ['/pictures/portfolio/', '/assets/images/photos/'],
      ['/pictures/reel/', '/assets/images/reel/'], ['/pictures/collage/', '/assets/images/textures/'],
      ['/case-assets/logos/', '/assets/images/logos/'], ['/case-assets/research/', '/assets/images/research/']
    ];
    var path = location.pathname, to = null;
    var name = path.replace(/^\/+|\/+$/g, '').replace(/\.html?$/i, '').toLowerCase();
    if (PAGES.hasOwnProperty(name)) to = PAGES[name];
    else if (/^\/Proctor_Noah_[A-Za-z_]+\.pdf$/.test(path)) to = '/assets/resume' + path;
    else if (/^\/case-assets\/[^/]+\.pdf$/i.test(path)) to = path.replace('/case-assets/', '/assets/docs/');
    else if (/^\/case-assets\/[^/]+\.(webp|jpe?g|png)$/i.test(path)) to = path.replace('/case-assets/', '/assets/images/projects/');
    else for (var i = 0; i < PREFIXES.length; i++) if (path.indexOf(PREFIXES[i][0]) === 0) { to = PREFIXES[i][1] + path.slice(PREFIXES[i][0].length); break; }
    if (to && to !== path) location.replace(to + location.search + location.hash);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400,100;1,9..144,400,100&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0b0b0b; --mute: #5d5d5a; --green: #0f9d6b; }

  main { max-width: 640px; }
  h1 { margin: 0 0 18px; font: 400 clamp(56px, 11vw, 120px)/.9 "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100; letter-spacing: -.045em; }
  p { margin: 0 0 28px; color: var(--mute); font: italic 400 clamp(19px, 2vw, 23px)/1.4 "Fraunces", Georgia, serif; }
  nav { display: flex; flex-wrap: wrap; gap: 12px; }
  a { padding: 12px 22px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); text-decoration: none; transition: background .2s, color .2s, box-shadow .2s; }
  a:first-child { background: var(--ink); color: #fff; }
  a:hover, a:focus-visible { background: var(--green); color: #fff; box-shadow: inset 0 0 0 1.5px var(--green); outline: none; }
</style>
